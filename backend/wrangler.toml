name = "vidapp-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/auth/*", "/admin/api/*", "/playlists*", "/videos/*", "/license*", "/me"]

[[d1_databases]]
binding = "DB"
database_name = "vidapp"
database_id = "PUT_YOUR_D1_ID_HERE"

[triggers]
crons = ["0 */6 * * *"]
